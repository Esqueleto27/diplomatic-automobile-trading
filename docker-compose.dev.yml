name: diplomatic-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diplomatic
      POSTGRES_PASSWORD: diplomatic_dev
      POSTGRES_DB: diplomatic_dev
    ports:
      - "5432:5432"
    volumes:
      - diplomatic_dev_db:/var/lib/postgresql/data

volumes:
  diplomatic_dev_db:
